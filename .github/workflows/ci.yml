name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Built pages match the source
        run: python3 tools/build.py --check
      - name: Every script parses
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["index.html", "educator.html", "admin.html"]) {
              const h = fs.readFileSync(f, "utf8");
              [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].forEach((m, i) => { new Function(m[1]); });
              console.log("ok", f);
            }
            new Function(fs.readFileSync("backend/apps_script/Code.gs", "utf8")); console.log("ok Code.gs");
            new Function(fs.readFileSync("tests/run.js", "utf8").replace(/^#!.*\n/, "")); console.log("ok run.js");
          '
          python3 -m py_compile backend/local_server/glide_local_server.py tests/verify.py tools/build.py
      - name: Data dictionary is valid JSON
        run: python3 -c "import json; json.load(open('src/data_dictionary.json'))"
      - name: No keys or study data committed
        run: |
          ! git ls-files | grep -E '(^|/)(keys\.json|state\.json)$|local_drive/|GLIDE_Study_Data/|\.webm$'
