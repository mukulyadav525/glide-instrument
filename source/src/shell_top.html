<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --ink:#12171C; --muted:#5C6670;
  --rule:#CFD6DC; --accent:#1D5C7A; --signal:#A8630F; --ok:#1F6B4A; --warn:#8A3324;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

#app{display:flex;height:100vh;overflow:hidden}
#left{flex:0 0 62%;display:flex;flex-direction:column;border-right:1px solid var(--rule);min-width:0}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{padding:9px 18px;background:var(--accent);color:#fff;font-family:var(--mono);font-size:11px;display:flex;gap:14px;align-items:center;flex:none}
#bar .v{color:#F2C476;font-weight:600}
#bar .sp{margin-left:auto;opacity:.7;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
#stage{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
#panel{flex:1;overflow:auto;padding:24px 26px}
#foot{flex:none;border-top:1px solid var(--rule);padding:12px 26px;display:flex;gap:12px;align-items:center}

/* CHILD MODE, larger, calmer, fewer things */
body.child{font-size:17px}
body.child #panel{padding:30px 28px}
body.child #foot{padding:16px 28px}

.card{background:var(--surface);border:1px solid var(--rule);width:100%;max-width:860px;padding:30px 28px;position:relative}
.tag{position:absolute;top:0;left:0;background:var(--accent);color:#fff;font-family:var(--mono);font-size:10px;padding:3px 8px;letter-spacing:.07em}
.spec p{margin:0 0 .9em}.spec p:last-child{margin:0}
.note{font-family:var(--mono);font-size:11.5px;color:var(--muted);max-width:860px;width:100%}

h1{font-size:21px;margin:0 0 10px;font-weight:600;line-height:1.25}
body.child h1{font-size:26px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.lede{color:var(--muted);margin:0 0 18px}
.hint{font-size:12.5px;color:var(--muted)}
h2{font-size:16px;margin:22px 0 9px}

/* two-choice buttons for children */
.pair{display:flex;gap:14px;margin:18px 0}
.pair button{flex:1;border:2px solid var(--rule);background:var(--surface);padding:26px 14px;font-size:20px;color:var(--ink);line-height:1.3}
.pair button:hover{border-color:var(--accent)}
.pair button.on{border-color:var(--accent);background:#EFF5F8}
.pair .which{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.06em}

/* three faces */
.faces{display:flex;gap:12px;margin:16px 0}
.faces button{flex:1;border:2px solid var(--rule);background:var(--surface);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.faces button.on{border-color:var(--accent);background:#EFF5F8}
.faces svg{width:52px;height:52px}

.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);padding:11px 13px;margin-bottom:7px;color:var(--ink);font-size:14.5px;line-height:1.35}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:#F3F7FA}
.opt .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.scale{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.scale button{flex:1;min-width:48px;border:1px solid var(--rule);background:var(--surface);padding:9px 4px;font-size:13px;color:var(--ink)}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono)}
.q{background:var(--surface);border:1px solid var(--rule);padding:14px 15px;margin-bottom:11px}
.q-t{font-weight:500;margin-bottom:8px;line-height:1.35}
.q-t .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

input[type=text],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--rule);background:var(--surface);font-family:inherit;font-size:14px;color:var(--ink)}
textarea{min-height:74px;resize:vertical}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.chip{display:inline-block;border:1px solid var(--rule);background:var(--surface);padding:7px 12px;margin:0 6px 6px 0;font-size:13.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.alloc{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.alloc .nm{flex:1;font-size:13.5px;line-height:1.3}
.alloc input{flex:0 0 140px}
.alloc .v{font-family:var(--mono);color:var(--signal);font-weight:600;width:34px;text-align:right}
.tot{font-family:var(--mono);padding:9px 12px;border:1px solid var(--rule);background:var(--surface);display:flex;justify-content:space-between}
.tot.good{border-color:var(--ok);color:var(--ok)}.tot.bad{border-color:var(--warn);color:var(--warn)}

.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:11px 22px;font-weight:500;font-size:15px}
body.child .btn{padding:15px 30px;font-size:18px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.stop{border-color:var(--warn);color:var(--warn);background:transparent;margin-left:auto}
.prog{flex:1;font-family:var(--mono);font-size:11px;color:var(--muted)}
.bar{height:3px;background:#DDE2E7;margin-top:4px}.bar>div{height:100%;background:var(--accent)}
.notice{border-left:3px solid var(--signal);background:#FDF7EE;padding:12px 14px;font-size:13.5px;margin:13px 0}
.notice.bad{border-color:var(--warn);background:#FBF0EE}
.notice.ok{border-color:var(--ok);background:#EEF6F1}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin:9px 0}
table.t td,table.t th{border:1px solid var(--rule);padding:7px 9px;text-align:left}
table.t th{background:#F2F5F7;width:38%}
.speak{border:1px solid var(--rule);background:var(--surface);padding:7px 12px;font-size:13px;color:var(--accent);margin-bottom:12px}
.hide{display:none!important}
.wrap{max-width:720px}

/* keyboard affordance, so an educator can answer without a mouse */
.kbd{display:inline-block;font-family:var(--mono);font-size:10px;border:1px solid var(--rule);background:#F2F5F7;color:var(--muted);
  border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.pair button .kbd{margin:0 0 0 8px}

/* mock page for layout / distraction */
.mock{font-family:Verdana,sans-serif;color:#1A1A1A;background:#fff;font-size:15px;line-height:1.55;position:relative}
.mock .nav{background:#1D5C7A;color:#fff;padding:8px 12px;font-size:12px;display:flex;gap:14px}
.mock .body{display:flex;gap:16px;padding:16px 14px}
.mock .main{flex:1;min-width:0}
.mock .side{flex:0 0 140px;font-size:11.5px}
.mock h3{font-size:19px;margin:0 0 10px}
.mock .ad{background:#F3EFE4;border:1px dashed #C4B896;color:#8A7A55;font-size:11px;text-align:center;padding:14px 8px;margin:11px 0;letter-spacing:.05em}
.mock .wid{background:#F2F5F7;border:1px solid #DFE4E9;padding:10px;margin-bottom:10px}
.mock .bottom{background:#1D5C7A;color:#fff;font-size:12px;padding:9px;text-align:center}
.mock .modal{position:absolute;inset:0;background:rgba(18,23,28,.55);display:grid;place-items:center;z-index:9}
.mock .modal>div{background:#fff;padding:22px;max-width:260px;text-align:center;font-size:13px}
.mock .chat{position:absolute;right:12px;bottom:12px;background:#1D5C7A;color:#fff;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;font-size:11px;z-index:8}
.mockwrap{position:relative;overflow:hidden;border:1px solid var(--rule);width:100%;max-width:860px;background:#fff}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.an-gif{animation:bl 1.1s steps(1) infinite}
.an-car{animation:sl 2.2s ease-in-out infinite}
.an-bad{animation:bl .8s ease-in-out infinite}
/* NOTE: the motion distractors are the stimulus, not decoration. A blanket
   prefers-reduced-motion override would silently turn two of the six distractor
   conditions into static ones and void their data, so motion is suppressed only
   when the instrument has recorded that it is doing so (body.rm), and the
   educator is told. See MOTION in the script. */
body.rm .an-gif,body.rm .an-car,body.rm .an-bad{animation:none;opacity:.65}
@media (max-width:900px){#app{flex-direction:column;height:auto}#left{flex:none;border-right:none;border-bottom:1px solid var(--rule)}}

/* info button + rationale modal */
.infobar{display:flex;justify-content:flex-end;margin-bottom:2px}
.infobtn{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);width:26px;height:26px;border-radius:50%;font-weight:700;font-size:14px;font-family:var(--ui);line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.infobtn:hover{background:#EFF5F8}
body.child .infobtn{width:32px;height:32px;font-size:17px}
.imodal{position:fixed;inset:0;background:rgba(18,23,28,.55);display:none;place-items:center;z-index:50;padding:22px}
.imodal.on{display:grid}
.imodal>div{background:var(--surface);border:1px solid var(--rule);max-width:560px;width:100%;max-height:82vh;overflow:auto;padding:24px 26px}
.imodal h3{font-size:16px;margin:0 0 4px}
.imodal .sub{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.imodal h4{font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:16px 0 5px}
.imodal p{margin:0 0 10px;font-size:14px;line-height:1.5}
.imodal .cite{font-size:12.5px;color:var(--muted);line-height:1.45;border-left:2px solid var(--rule);padding-left:10px}
.imodal .close{margin-top:18px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;font-size:14px}

/* calibration + validation targets */
.caldot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;background:var(--accent)}
.caldot.done{background:#8FBF9F}
.valdot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 0 0 2px var(--accent);background:var(--warn)}
.valdot.done{background:#8FBF9F}

/* ---------------- v5: video, framing, physical calibration, link ---------------- */
/* Always-on recording indicator. Fixed, never covered, never animated (motion
   is a stimulus in this study, so a pulsing dot would be a seventh distractor). */
#recind{position:fixed;top:6px;right:8px;z-index:90;background:#8A3324;color:#fff;font-family:var(--mono);font-size:11px;
  padding:3px 9px 3px 7px;border-radius:10px;display:none;align-items:center;gap:6px;letter-spacing:.04em}
#recind.on{display:flex}
#recind i{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
#recind.lost{background:#5C6670}
/* Sync flash: one full-screen white frame, logged on the shared clock, visible
   in the face video as a brightness step. */
#syncflash{position:fixed;inset:0;background:#fff;z-index:95;display:none}
#syncflash.on{display:block}
/* The one camera element. Off-screen-ish but still composited (requestVideoFrameCallback
   does not fire for display:none video). Shown large only on the framing screen. */
#camview{position:fixed;left:0;bottom:0;width:4px;height:3px;opacity:.01;pointer-events:none;z-index:1}
#camview.preview{position:relative;left:auto;bottom:auto;width:100%;height:auto;opacity:1;transform:scaleX(-1);display:block}
.framebox{position:relative;width:100%;max-width:640px;background:#000;overflow:hidden}
.framebox .oval{position:absolute;left:50%;top:48%;width:34%;height:62%;transform:translate(-50%,-50%);border:4px dashed #fff;border-radius:50%;pointer-events:none}
.framebox .oval.good{border-color:#8FBF9F;border-style:solid}
.checks{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:10px 0;font-size:13.5px}
.chk{width:12px;height:12px;border-radius:50%;margin-top:4px}
.chk.g{background:#1F6B4A}.chk.a{background:#C99A2E}.chk.r{background:#8A3324}.chk.n{background:#CFD6DC}
/* calibration target: a dot that shrinks once, never loops */
.ctarget{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--accent);
  border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);transition:width 1.4s ease-out,height 1.4s ease-out}
.ctarget.shrunk{width:14px;height:14px}
.ctarget::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#fff;border-radius:50%}
/* credit-card match */
.ccard{border:2px solid var(--accent);border-radius:3.5%/5.5%;background:repeating-linear-gradient(45deg,#EFF5F8,#EFF5F8 8px,#E3EDF2 8px,#E3EDF2 16px);margin:10px 0}
/* blind-spot task */
.bs{position:relative;width:100%;height:200px;background:#fff;border:1px solid var(--rule)}
.bs .fix{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;background:#12171C}
.bs .ball{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#8A3324}
/* link / upload status pill in the bar */
.linkpill{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.18)}
.linkpill.bad{background:#8A3324}
.big-code{font-family:var(--mono);font-size:34px;letter-spacing:.25em;text-transform:uppercase}
input.codein{font-family:var(--mono);font-size:26px;letter-spacing:.3em;text-transform:uppercase;text-align:center}

/* screen-reader-only live region */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="imodal" id="imodal" role="dialog" aria-modal="true" aria-label="Why we ask this"><div id="imodal-body"></div></div>
<div class="sr" id="live" aria-live="polite"></div>
<div id="recind" role="status" aria-live="polite"><i></i><span>Recording video</span></div>
<div id="syncflash" aria-hidden="true"></div>
<video id="camview" muted playsinline autoplay aria-hidden="true"></video>
<div id="app">
  <section id="left" aria-label="What the child sees">
    <div id="bar"></div>
    <div id="stage"></div>
  </section>
  <section id="right" aria-label="Questions">
    <div id="panel"></div>
    <div id="foot">
      <button class="btn ghost" id="back">Back</button>
      <div class="prog"><span id="ptxt"></span><div class="bar"><div id="pbar" style="width:0%"></div></div></div>
      <button class="btn" id="next">Next</button>
      <button class="btn stop hide" id="stop">Stop now</button>
    </div>
  </section>
</div>
